<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a4d">
<meta name="description" content="Gestão financeira, comercial e operacional do negócio de açaí.">
<title>Açaí ERP — Gestão do negócio</title>
<link rel="manifest" href="manifest.json?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=6">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=6">
<link rel="apple-touch-icon" href="icon-192.png?v=6">
<link rel="stylesheet" href="styles.css?v=6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  try {
    var t = JSON.parse(localStorage.getItem('acai-erp-v1') || '{}').meta?.theme || 'light';
    document.documentElement.dataset.theme = (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : t;
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="icon-btn menu-btn" data-act="toggle-sidebar" aria-label="Abrir menu"><span data-icon="menu"></span></button>
    <div class="brand">
      <span class="brand-mark"><span data-icon="brand" data-size="16"></span></span>
      <div>
        <strong id="brand-name">Açaí ERP</strong>
        <small id="brand-sub">Gestão do negócio</small>
      </div>
    </div>
    <div class="top-actions">
      <span id="sync-pill" class="pill" data-act="open-sync" title="Estado da sincronização">Local</span>
      <button class="icon-btn" data-act="toggle-theme" aria-label="Alternar tema" title="Tema"><span data-icon="theme"></span></button>
      <button class="icon-btn" data-act="open-auth" aria-label="Conta" title="Conta"><span data-icon="user"></span></button>
    </div>
  </header>

  <aside id="sidebar" aria-label="Menu principal">
    <nav id="nav-list"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost small" data-act="open-auth">Entrar / Conta</button>
      <span class="muted tiny">Dados salvos neste aparelho e na nuvem quando conectado.</span>
    </div>
  </aside>
  <div id="sidebar-overlay" data-act="toggle-sidebar"></div>

  <main id="main">
    <div id="view"></div>
    <footer id="foot">
      <span>Açaí ERP · valores em R$ · fuso America/Sao_Paulo</span>
      <span id="last-sync" class="muted"></span>
    </footer>
  </main>

  <nav id="bottom-nav" aria-label="Navegação rápida"></nav>
  <button id="quick-fab" data-act="quick-sale" aria-label="Venda rápida" title="Venda rápida"><span data-icon="plus" data-size="24"></span></button>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</div>

<script src="js/icons.js?v=6"></script>
<script src="js/core.js?v=6"></script>
<script src="js/calc.js?v=6"></script>
<script src="js/views.js?v=6"></script>
<script src="js/actions.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
